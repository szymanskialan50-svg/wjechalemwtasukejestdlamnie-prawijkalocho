name: Build USC-CAM (iOS .ipa + Windows .exe)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build app (unsigned)
        run: |
          xcodebuild -project USBWebcam.xcodeproj \
                     -scheme USBWebcam \
                     -sdk iphoneos \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -derivedDataPath build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     clean build

      - name: Package .ipa
        run: |
          APP="build/Build/Products/Release-iphoneos/USBWebcam.app"
          test -d "$APP" || { echo "App not found"; find build -name "*.app" -maxdepth 6; exit 1; }
          rm -rf Payload output
          mkdir -p Payload output
          cp -r "$APP" Payload/
          zip -qry output/USC-CAM.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: output/USC-CAM.ipa

  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install opencv-python-headless numpy pyqt5 pyvirtualcam av pyinstaller

      - name: Add camera driver (DirectShow DLL, shows up as "HD Camera iPhone")
        shell: bash
        run: |
          git clone --depth 1 https://github.com/schellingb/UnityCapture.git uc
          mkdir -p drv
          f64=$(find uc -type f -iname "UnityCaptureFilter64bit.dll" -not -path "uc/.git/*" | head -1)
          f32=$(find uc -type f -iname "UnityCaptureFilter32bit.dll" -not -path "uc/.git/*" | head -1)
          if [ -z "$f64" ] || [ -z "$f32" ]; then
            echo "UnityCapture DLLs not found. Repo files:"; find uc -type f -not -path "uc/.git/*" | head -60; exit 1
          fi
          cp -v "$f64" drv/HDCameraiPhone64.dll
          cp -v "$f32" drv/HDCameraiPhone32.dll
          lic=$(find uc -maxdepth 1 -iname "LICENSE*" | head -1)
          [ -n "$lic" ] && cp "$lic" drv/LICENSE-UnityCapture.txt || true

      - name: Build single-file EXE
        shell: bash
        env:
          MSYS_NO_PATHCONV: "1"
          MSYS2_ARG_CONV_EXCL: "*"
        run: |
          pyinstaller --noconfirm --onefile --windowed \
            --name "USC-CAM" \
            --icon desktop/icon.ico \
            --add-data "desktop/icon.ico;." \
            --add-data "drv;driver" \
            --paths desktop \
            --collect-all pyvirtualcam \
            --collect-all av \
            desktop/main.py

      - name: Collect files
        shell: bash
        run: |
          mkdir -p dist/driver
          cp drv/* dist/driver/
          cp desktop/Install-HD-Camera.bat desktop/Uninstall-HD-Camera.bat dist/

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            dist/USC-CAM.exe
            dist/driver/
            dist/Install-HD-Camera.bat
            dist/Uninstall-HD-Camera.bat

  package-zip:
    name: Bundle final ZIP
    needs: [build-ios, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download iOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: release/

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: release/

      - name: Create ZIP
        run: |
          cd release
          zip -r ../USC-CAM-Package.zip .

      - name: Upload Complete Bundle
        uses: actions/upload-artifact@v4
        with:
          name: USC-CAM-Package
          path: USC-CAM-Package.zip
